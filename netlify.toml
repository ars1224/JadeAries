[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions.exportFoodReport]
  node_bundler = "zisi"
  included_files = ["node_modules/pdfkit/js/data/**"]

[[redirects]]
  from = "/database/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/functions/*"
  to = "/index.html"
  status = 404
  force = true
